
name: Build UnConfuserEx

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install .NET Framework 4.5.2 Targeting Pack
        shell: pwsh
        run: |
          $url = "https://go.microsoft.com/fwlink/?linkid=328851"
          $installer = "$env:TEMP\NDP452-DevPack.exe"
      
          Invoke-WebRequest $url -OutFile $installer
      
          $process = Start-Process $installer `
            -ArgumentList "/q", "/norestart" `
            -Wait -PassThru
      
          Write-Host "Installer exit code: $($process.ExitCode)"
      
          $referencePath = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5.2"
      
          if (!(Test-Path $referencePath)) {
            throw "The .NET Framework 4.5.2 targeting pack is still missing."
          }
      
          Write-Host "Targeting pack installed successfully."

      - name: Restore dependencies
        run: dotnet restore ConfuserExCustomModuleConstUnpacker/ConfuserExCustomModuleConstUnpacker.sln

      - name: Build Release
        run: dotnet build ConfuserExCustomModuleConstUnpacker/ConfuserExCustomModuleConstUnpacker.sln -c Release --no-restore

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: UnConfuserEx-Windows
          path: |
            UnConfuserEx/bin/Release/net9.0/
          if-no-files-found: error
          retention-days: 30
